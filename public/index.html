<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tube Scout</title><link rel="stylesheet" href="/style.css"><style>.schedule-enable,.schedule-interval{display:flex;align-items:center;gap:8px;font-weight:700;color:#506064}.schedule-interval input{width:110px}.schedule-next{margin-top:12px}.nfo-help{grid-column:1/-1}.badge.AWAITING_APPROVAL{background:#e9edf8;color:#4e5f99}</style></head>
<body><aside class="sidebar"><div class="brand"><span class="brandmark">YT</span><span>Tube Scout<small>DISCOVERY CONSOLE</small></span></div><nav id="nav">
<button class="navitem active" data-view="overview">◫ &nbsp; Overview</button><button class="navitem" data-view="sources">◎ &nbsp; Sources</button><button class="navitem" data-view="keywords">⌕ &nbsp; Keyword Management</button><button class="navitem" data-view="approval">◉ &nbsp; Pending Approval</button><button class="navitem" data-view="approved">✓ &nbsp; Approved Videos</button><button class="navitem" data-view="queue">▤ &nbsp; Import Queue</button><button class="navitem" data-view="failed">↻ &nbsp; Failed Videos</button><button class="navitem" data-view="history">◷ &nbsp; Scan History</button>
</nav><div class="sidefoot"><span class="pulse"></span> Scanner dashboard <span class="muted">· LAN use only</span></div></aside>
<main><header><div><div class="eyebrow" id="crumb">WORKSPACE / OVERVIEW</div><h1 id="heading">Overview</h1></div><button class="button primary" id="scanAll">▶ &nbsp; Scan all sources</button></header><div id="notice" class="notice" hidden></div><section id="stats" class="stats"></section><section id="content"></section></main>
<dialog id="sourceDialog"><form id="sourceForm"><div class="dialoghead"><div><div class="eyebrow">SOURCE CONFIGURATION</div><h2 id="formTitle">Add a source</h2></div><button class="iconbtn" type="button" id="closeDialog">×</button></div><input type="hidden" name="id"><div class="formgrid"><label>Source name<input name="name" required maxlength="160" placeholder="Science channel"></label><label>Source type<select name="type"><option value="channel">Channel</option><option value="playlist">Playlist</option><option value="shorts">Shorts</option></select></label><label class="wide">YouTube URL<input name="url" type="url" required placeholder="https://www.youtube.com/@channel"></label><label>Videos per scan<input name="videosPerScan" type="number" min="1" max="10000" value="50" required></label><label>Priority<select name="priority"><option>HIGH</option><option selected>NORMAL</option><option>LOW</option></select></label><label>Keyword rule<select name="matchMode"><option>ANY</option><option>ALL</option></select></label><label class="wide">Include keywords <small>Comma separated; blank accepts all</small><textarea name="keywords" rows="2" placeholder="space, astronomy"></textarea></label><label class="wide">Exclude keywords<textarea name="excludeKeywords" rows="2" placeholder="trailer, reaction"></textarea></label><label class="check"><input name="enabled" type="checkbox" checked> Scan this source</label><label class="check"><input name="scanDescription" type="checkbox" checked> Include descriptions in keyword matching</label><label class="check"><input name="generateNfo" type="checkbox"> Generate NFO and scan its description</label><p class="sub nfo-help">NFO files are written to the external directory mounted as /nfo (Portainer: NFO_HOST_PATH).</p><label class="check" id="autoApproveField"><input name="autoApproveVideos" type="checkbox"> Automatically approve matching videos (skip manual verification)</label></div><div class="dialogactions"><button class="button" type="button" id="cancelDialog">Cancel</button><button class="button primary">Save source</button></div></form></dialog>
<script src="/app.js" defer></script></body></html>
