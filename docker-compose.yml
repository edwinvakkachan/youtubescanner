services:
  app:
    build: .
    container_name: youtube-scanner
    restart: unless-stopped
    init: true
    environment:
      PORT: ${PORT:-3000}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in the Compose or Portainer stack environment}
      YT_DLP_PATH: /opt/yt-dlp/bin/yt-dlp
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      NFO_DIRECTORY: /nfo
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - type: bind
        source: ${NFO_HOST_PATH:-./nfo}
        target: /nfo
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
